name: Test

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run it replaces. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests, CLI and MCP smoke tests, the native binary and the installers.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same version as scripts/build-binaries.mjs, so it uses this instead of fetching Bun with npx
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npm run build
      - run: npm run test:core

  # The lecture video acceptance test, from a fresh home with real downloads.
  # Each install channel runs as its own job so the two run at the same time.
  video:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        channel: [native, npm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      # The test serves this binary to the installer. `npm pack` in the test builds dist/ itself.
      - run: npm run build:bin -- host
      - run: npm run test:video -- --ci --channel=${{ matrix.channel }}
